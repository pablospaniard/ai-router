<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">AIRO decision routing examples</title>
  <desc id="desc">Three provider-neutral examples show AIRO routing workflow phases through Model A, Model B, and Model C using a parallel fork, a feedback loop, and a short path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091a31"/><stop offset="1" stop-color="#050d1c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#112b50"/><stop offset="1" stop-color="#0a1a30"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60c7ff"/><stop offset="1" stop-color="#2479f5"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc07a"/><stop offset="1" stop-color="#f76c32"/></linearGradient>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l12 6-12 6z" fill="#4caaff"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l12 6-12 6z" fill="#ff9a68"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l12 6-12 6z" fill="#52d6a9"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#eef6ff}.muted{fill:#9bb4d3}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#60b9ff}.heading{font-size:42px;font-weight:750}.sub{font-size:19px;fill:#b9cbe4}.example{font-size:21px;font-weight:700}.task{font-size:17px;fill:#b9cbe4}.phase{font-size:15px;font-weight:700}.model{font-size:13px;fill:#dcecff}.small{font-size:14px;fill:#a8bfda}.legend{font-size:16px;font-weight:650}.tag{font-size:12px;font-weight:750;letter-spacing:1.2px}.pattern{font-size:15px;font-weight:650}
    </style>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="800" cy="-120" r="570" fill="#0e4a91" opacity=".16"/>
  <path d="M100 200H1500" stroke="#1c4d82" stroke-opacity=".45"/>
  <text x="100" y="94" class="eyebrow">ADAPTIVE INTELLIGENCE ROUTING</text>
  <text x="100" y="147" class="heading">One job. Many informed routing decisions.</text>
  <text x="100" y="183" class="sub">AIRO evaluates every phase independently, so one workflow can change models, branch, loop, or take a shorter path.</text>

  <!-- routing key -->
  <rect x="100" y="225" width="1400" height="118" rx="18" fill="#0c213d" stroke="#265587"/>
  <text x="132" y="267" class="legend">How to read this</text>
  <path d="M132 293H202" stroke="#3b9cff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="220" y="291" class="small">each arrow is a fresh routing decision, shaped by task signals, rules, feedback,</text>
  <text x="220" y="313" class="small">availability, and your preferences</text>
  <rect x="1190" y="250" width="92" height="42" rx="12" fill="#382d38" stroke="#a95c50"/><circle cx="1210" cy="271" r="7" fill="#ff9a68"/><text x="1225" y="277" class="model">Model A</text>
  <rect x="1295" y="250" width="92" height="42" rx="12" fill="#0b3565" stroke="#2479c8"/><circle cx="1315" cy="271" r="7" fill="#61c9ff"/><text x="1330" y="277" class="model">Model B</text>
  <rect x="1400" y="250" width="92" height="42" rx="12" fill="#30245a" stroke="#8d67f6"/><circle cx="1420" cy="271" r="7" fill="#a98bff"/><text x="1435" y="277" class="model">Model C</text>

  <!-- example 1: parallel investigation, then rejoin -->
  <rect x="100" y="375" width="1400" height="245" rx="22" fill="url(#panel)" stroke="#28598c"/>
  <rect x="100" y="375" width="10" height="245" rx="5" fill="url(#blue)"/>
  <text x="140" y="420" class="example">01 · Fix a production regression</text>
  <text x="140" y="450" class="task">Investigate different signals in parallel,</text>
  <text x="140" y="474" class="task">then rejoin around the strongest evidence.</text>
  <rect x="140" y="508" width="146" height="31" rx="15" fill="#0b3565" stroke="#2479c8"/>
  <text x="158" y="529" class="tag" fill="#8ed8ff">FORK + REJOIN</text>

  <g transform="translate(535 449)"><rect width="175" height="96" rx="15" fill="#382d38" stroke="#a95c50"/><text x="18" y="31" class="phase">ANALYZE</text><text x="18" y="61" class="model">Model A</text><text x="18" y="83" class="small">form hypotheses</text></g>
  <path d="M710 497H750" fill="none" stroke="#4caaff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="750" cy="497" r="6" fill="#4caaff"/>
  <path d="M750 497c28 0 25-62 43-62" fill="none" stroke="#4caaff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M750 497c28 0 25 62 43 62" fill="none" stroke="#4caaff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <g transform="translate(805 398)"><rect width="180" height="74" rx="14" fill="#30245a" stroke="#8d67f6"/><text x="17" y="28" class="phase">REPRODUCE</text><text x="17" y="54" class="model">Model C · fast signal</text></g>
  <g transform="translate(805 522)"><rect width="180" height="74" rx="14" fill="#0b3565" stroke="#2479c8"/><text x="17" y="28" class="phase">TRACE</text><text x="17" y="54" class="model">Model B · code path</text></g>
  <path d="M985 435h15c20 0 18 62 31 62" fill="none" stroke="#4caaff" stroke-width="3"/>
  <path d="M985 559h15c20 0 18-62 31-62" fill="none" stroke="#4caaff" stroke-width="3"/>
  <circle cx="1031" cy="497" r="6" fill="#4caaff"/>
  <path d="M1031 497h22" fill="none" stroke="#4caaff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <g transform="translate(1065 449)"><rect width="175" height="96" rx="15" fill="#0b3565" stroke="#2479c8"/><text x="18" y="31" class="phase">PATCH</text><text x="18" y="61" class="model">Model B</text><text x="18" y="83" class="small">apply the fix</text></g>
  <path d="M1240 497h48" fill="none" stroke="#4caaff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <g transform="translate(1300 449)"><rect width="160" height="96" rx="15" fill="#30245a" stroke="#8d67f6"/><text x="18" y="31" class="phase">REVIEW</text><text x="18" y="61" class="model">Model C</text><text x="18" y="83" class="small">fresh context</text></g>

  <!-- example 2: review can send the work through another pass -->
  <rect x="100" y="640" width="1400" height="245" rx="22" fill="url(#panel)" stroke="#28598c"/>
  <rect x="100" y="640" width="10" height="245" rx="5" fill="url(#orange)"/>
  <text x="140" y="685" class="example">02 · Shape and deliver a new capability</text>
  <text x="140" y="715" class="task">A review can trigger another build pass.</text>
  <text x="140" y="739" class="task">The next decision uses what the team learned.</text>
  <rect x="140" y="773" width="164" height="31" rx="15" fill="#382d38" stroke="#a95c50"/>
  <text x="158" y="794" class="tag" fill="#ffc09e">LOOP + REROUTE</text>

  <g transform="translate(535 697)"><rect width="170" height="96" rx="15" fill="#30245a" stroke="#8d67f6"/><text x="18" y="31" class="phase">PLAN</text><text x="18" y="61" class="model">Model C</text><text x="18" y="83" class="small">define the slice</text></g>
  <path d="M705 745h48" fill="none" stroke="#ff9a68" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g transform="translate(765 697)"><rect width="170" height="96" rx="15" fill="#0b3565" stroke="#2479c8"/><text x="18" y="31" class="phase">BUILD</text><text x="18" y="61" class="model">Model B</text><text x="18" y="83" class="small">deliver a pass</text></g>
  <path d="M935 745h48" fill="none" stroke="#ff9a68" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g transform="translate(995 697)"><rect width="170" height="96" rx="15" fill="#382d38" stroke="#a95c50"/><text x="18" y="31" class="phase">REVIEW</text><text x="18" y="61" class="model">Model A</text><text x="18" y="83" class="small">challenge choices</text></g>
  <path d="M1165 745h108" fill="none" stroke="#ff9a68" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g transform="translate(1285 697)"><rect width="165" height="96" rx="15" fill="#30245a" stroke="#8d67f6"/><text x="18" y="31" class="phase">VERIFY</text><text x="18" y="61" class="model">Model C</text><text x="18" y="83" class="small">final confidence</text></g>
  <path d="M1080 793c0 58-230 58-230 0" fill="none" stroke="#ff9a68" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>
  <rect x="850" y="830" width="230" height="28" rx="14" fill="#0a1a30" stroke="#a95c50" stroke-opacity=".75"/>
  <text x="869" y="849" class="small" fill="#ffc09e">feedback → another build pass</text>

  <!-- example 3 and routing-pattern key -->
  <rect x="100" y="905" width="880" height="210" rx="22" fill="url(#panel)" stroke="#28598c"/>
  <rect x="100" y="905" width="10" height="210" rx="5" fill="#27d3a3"/>
  <text x="140" y="950" class="example">03 · A focused change can take the short path</text>
  <text x="140" y="979" class="task">AIRO skips phases that the request does not need.</text>
  <rect x="140" y="1012" width="112" height="52" rx="26" fill="#0a1a30" stroke="#2c668e"/>
  <circle cx="162" cy="1038" r="6" fill="#52d6a9"/>
  <text x="177" y="1043" class="tag" fill="#9de9ce">REQUEST</text>
  <path d="M252 1038h70" fill="none" stroke="#52d6a9" stroke-width="4" marker-end="url(#arrow-green)"/>
  <g transform="translate(335 1000)"><rect width="210" height="76" rx="14" fill="#0b3565" stroke="#2479c8"/><text x="18" y="29" class="phase">EDIT</text><text x="18" y="56" class="model">Model B · focused change</text></g>
  <path d="M545 1038h70" fill="none" stroke="#52d6a9" stroke-width="4" marker-end="url(#arrow-green)"/>
  <g transform="translate(628 1000)"><rect width="210" height="76" rx="14" fill="#30245a" stroke="#8d67f6"/><text x="18" y="29" class="phase">VERIFY</text><text x="18" y="56" class="model">Model C · targeted check</text></g>
  <rect x="853" y="1012" width="91" height="52" rx="16" fill="#0a1a30" stroke="#2c668e" stroke-dasharray="5 5"/>
  <text x="873" y="1034" class="tag" fill="#9de9ce">SHORT</text><text x="878" y="1051" class="tag" fill="#9de9ce">PATH</text>

  <rect x="1010" y="905" width="490" height="210" rx="22" fill="#0c213d" stroke="#28598c"/>
  <text x="1045" y="950" class="eyebrow">ROUTING PATTERNS</text>
  <circle cx="1052" cy="982" r="5" fill="#4caaff"/><text x="1070" y="987" class="pattern">Fork and rejoin independent work</text>
  <circle cx="1052" cy="1014" r="5" fill="#ff9a68"/><text x="1070" y="1019" class="pattern">Loop when feedback changes the task</text>
  <circle cx="1052" cy="1046" r="5" fill="#52d6a9"/><text x="1070" y="1051" class="pattern">Skip phases that add no value</text>
  <text x="1045" y="1083" class="small">Models A, B, and C are abstractions—not fixed roles.</text>
  <text x="1045" y="1103" class="small">Configure the models and providers available to you.</text>

  <text x="100" y="1162" class="small">Routes are illustrative. Your configured models, explicit flags, provider availability, and project rules always take precedence.</text>
</svg>
